name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests that find a defect stay red, so the job fails on purpose
      - name: Run unit tests with coverage
        id: tests
        run: npm run coverage

      # the steps below also run when tests failed, but not when npm ci failed
      - name: Check coverage thresholds
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run coverage:check

      - name: Create HTML test report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run report

      - name: Upload test and coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: |
            mochawesome-report/
            coverage/

      # finally, send coverage to Coveralls (if the tests ran at all)
      - name: Send coverage to Coveralls
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: coverallsapp/github-action@v2.3.8
        with:
          file: coverage/lcov.info
